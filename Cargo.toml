[package]
name = "tiktoken-cli"
version = "0.1.0"
edition = "2024"
description = "Offline token counting, encoding, and decoding"
license = "MIT"

[[bin]]
name = "tiktoken"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
cli-command-kit = { git = "https://github.com/alexgorbatchev/cli-command-kit-rust.git", rev = "40210e689762f6606776764bb3696e2685198c2e" }
tiktoken-rs = "=0.12.1"

[dev-dependencies]
tempfile = "3.27.0"
